<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Part-DB Smart Storage</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Part-DB Smart Storage</h1>
      <p id="health">Verbinde...</p>
    </div>
    <button id="offBtn" title="LEDs ausschalten">Aus</button>
  </header>

  <main>
    <section class="workspace">
      <div class="toolbar">
        <input id="findInput" placeholder="Teil suchen, z.B. 10k Widerstand">
        <button id="findBtn">Suchen & leuchten</button>
      </div>
      <div id="magazines"></div>
    </section>

    <aside>
      <section>
        <h2>Teil zuordnen</h2>
        <div class="form-grid">
          <input id="partSearch" placeholder="Part-DB durchsuchen">
          <button id="partSearchBtn">Suchen</button>
        </div>
        <select id="partSelect"></select>
        <select id="slotSelect"></select>
        <textarea id="notes" placeholder="Notiz, Barcode, Synonym"></textarea>
        <button id="assignBtn">Speichern & testen</button>
      </section>

      <section>
        <h2>Zuordnungen</h2>
        <div id="assignments"></div>
      </section>

      <section>
        <h2>Einstellungen</h2>
        <div id="settingsPanel"></div>
      </section>

      <section>
        <h2>Barcode</h2>
        <div id="barcodePanel"></div>
      </section>

      <section>
        <h2>Setup-Assistent</h2>
        <div class="wizard-tabs">
          <button class="tab active" data-step="arrangement">Anordnung</button>
          <button class="tab" data-step="leds">LEDs</button>
          <button class="tab" data-step="review">Test</button>
        </div>
        <div id="setupGuide"></div>
      </section>
    </aside>
  </main>

  <div id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
